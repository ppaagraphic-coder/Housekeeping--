<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบส่งผ้าซัก</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#eef1f0;--c:#fff;--t:#18211d;--m:#5f6b65;--a:#1f5f4a;--r:#b3261e;--l:#d3d9d6}
@media(prefers-color-scheme:dark){:root{--bg:#131816;--c:#1d2421;--t:#e8ece9;--m:#98a39d;--a:#2f8a6c;--r:#ff8a80;--l:#34403b}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Sarabun,sans-serif;background:var(--bg);color:var(--t)}
header{display:flex;justify-content:space-between;padding:12px 16px;background:var(--a);color:#fff}
nav{display:flex;gap:6px;padding:8px 10px;overflow-x:auto}nav button{flex:1;white-space:nowrap}
.card{background:var(--c);border:1px solid var(--l);border-radius:8px;padding:14px;margin:10px;max-width:820px}
h2,h3{margin:0 0 8px}label{display:block;margin:8px 0;color:var(--m);font-size:13px}
input,select,textarea{width:100%;padding:8px;font:inherit;border:1px solid var(--l);border-radius:6px;background:var(--bg);color:var(--t)}
button{padding:9px 14px;font:inherit;border:1px solid var(--l);border-radius:6px;background:var(--c);color:var(--t);margin:4px 4px 4px 0;cursor:pointer}
button.p,nav button.on{background:var(--a);color:#fff;border-color:var(--a)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
table{width:100%;border-collapse:collapse}td,th{padding:4px 6px;border-bottom:1px solid var(--l);text-align:left}td .q{width:74px}td .m{min-width:110px}
@media print{body{background:#fff!important}}
.fl input,.fl canvas{background:var(--c)}.fl canvas{background:#fff}
canvas{background:#fff;border:1px solid var(--l);width:100%;max-width:360px;touch-action:none;display:block}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.k div{background:var(--bg);padding:10px;border-radius:6px;font-size:13px}.k b{font-size:24px;display:block}
.tb{display:flex;gap:6px;margin-bottom:10px}.tb button{flex:1;margin:0;padding:9px 2px;white-space:nowrap;font-weight:700;background:transparent;border-width:2px}
.doc{background:#fff;color:#000;padding:14px;margin:10px;max-width:820px;border:1px solid #ccc;overflow-x:auto}
.doc input{background:#fff;color:#000;border-color:#999;padding:3px 5px}.doc .g2{width:64px}
.ft td,.ft th{border:1px solid #888;padding:2px 5px;font-size:12px;text-align:center}.ft td:nth-child(2){text-align:left}
.hdi{display:block;width:100%;height:auto;margin:0 0 8px}.c{text-align:center}.mt{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin:8px 0;font-size:13px}
.sg{display:flex;justify-content:space-around;text-align:center;margin-top:14px;font-size:13px}.ln{border-top:1px solid #000;margin-top:4px;padding-top:2px;min-width:160px}
@media print{#app>*:not(#out),#out>div:last-child{display:none!important}.doc{border:0;margin:0}}

.dw{margin:10px;overflow-x:auto}
#dc{width:297mm;min-height:210mm;max-width:none;margin:0;padding:8mm 10mm;zoom:var(--z,1)}
#dc h3{margin:0 0 4px}#dc .mt{margin:4px 0}#dc .sg{margin-top:10px}
#dc .ft td,#dc .ft th{padding:1px 5px;font-size:11px;line-height:1.3}
.dr{font-style:italic;color:#d4572a;font-weight:700}
.ct td,.ct th{text-align:center}.ct td:nth-child(2){text-align:left}
@page{size:A4 landscape;margin:6mm}
@media print{#dc{zoom:1!important;width:100%;min-height:0;padding:0;border:0}.dw{margin:0;overflow:visible}}
</style></head><body>
<div id="lg" class="card" style="max-width:340px;margin:12vh auto"><h2>ระบบส่งผ้าซัก</h2>
<label>รหัส PIN<input id="pin" type="password" inputmode="numeric" onkeydown="if(event.key=='Enter')login()"></label><button class="p" id="lgb" onclick="login()">เข้าสู่ระบบ</button></div>
<div id="app" hidden><header><b>ส่งผ้าซัก</b><span id="ro"></span></header>
<nav><button data-k="f" onclick="go('f')">ใบรับผ้าชั้น</button><button data-k="n" onclick="go('n')">ใบส่งผ้า</button><button data-k="r" onclick="go('r')">รับคืน</button><button data-k="s" onclick="go('s')">สรุป</button></nav>
<div id="v"></div><div id="out"></div></div>

const API='https://script.google.com/macros/s/AKfycbzrHIaRQMPpf1D1idInEK6Waf6VviPLYI6MoAogBTkdTMZzXQNE-vuQ1oAPsZyLn4KqoQ/exec';
const IT=['ผ้าปูที่นอนแบบติดซิป (ด้าน A) ขนาด 183 ซม.','ผ้าปูที่นอนแบบติดซิป (ด้าน B) ขนาด 107 ซม.','ผ้ารองกันเปื้อนกันน้ำ ขนาด 183 ซม.','ผ้ารองกันเปื้อนกันน้ำ ขนาด 107 ซม.','ผ้าปูที่นอนแบบรัดมุม ขนาด 183 ซม.','ผ้าปูที่นอนแบบรัดมุม ขนาด 107 ซม.','ปลอกผ้านวม ขนาด 80 นิ้ว','ปลอกผ้านวม ขนาด 105 นิ้ว','ไส้ผ้านวมไมโครไฟเบอร์ 3D ขนาด 80 นิ้ว','ไส้ผ้านวมไมโครไฟเบอร์ 3D ขนาด 105 นิ้ว','หมอนไมโครไฟเบอร์ ขนาด 19','หมอนไมโครไฟเบอร์ ขนาด 19 แบบแข็ง','ปลอกหมอนกันเปื้อนติดซิป ขนาด 19 นิ้ว','ปลอกหมอน ขนาด 20 นิ้ว','ผ้าขนหนูเช็ดตัว ขนาด 30','ผ้าขนหนูเช็ดมือ ขนาด 15','ผ้าขนหนูเช็ดหน้า ขนาด 12','ผ้าขนหนูเช็ดเท้า ขนาด 18','เสื้อคลุมอาบน้ำผ้าฝ้าย ขนาด 56'];

function ld(){try{const o=JSON.parse(localStorage.getItem(LS)||'{}');DR=o.dr||{};FD=o.fd||'';fl=Number.isInteger(o.fl)&&o.fl>=0&&o.fl<=5?o.fl:1}catch(e){DR={}}}
function sv(){try{localStorage.setItem(LS,JSON.stringify({dr:DR,fd:FD,fl}))}catch(e){}}
ld();

async function api(o){try{return await(await fetch(API,{method:'POST',body:JSON.stringify({...o,pin})})).json()}catch(e){return{ok:false,err:'เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ต'}}}
async function login(){pin=$('#pin').value;$('#lgb').textContent='กำลังเข้าสู่ระบบ…';const r=await api({a:'login'});$('#lgb').textContent='เข้าสู่ระบบ';
 if(!r.ok)return alert(r.err);docs=r.docs||[];$('#ro').textContent=r.role=='admin'?'Admin':'หัวหน้าแม่บ้าน';$('#lg').hidden=true;$('#app').hidden=false;go('f')}
function go(k){keep();document.body.style.background='';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.k==k));$('#out').innerHTML='';({f:vf,n:vn,r:vr,s:vs})[k]()}
function pad(c){const x=c.getContext('2d');x.lineWidth=2.5;x.lineCap='round';let d=0;
 const p=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
 c.onpointerdown=e=>{d=1;c.dataset.s=1;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...p(e))};
 c.onpointermove=e=>{if(d){x.lineTo(...p(e));x.stroke()}};c.onpointerup=()=>{d=0;c.dispatchEvent(new Event('input',{bubbles:true}))}}
function clr(id){const c=$('#'+id);c.getContext('2d').clearRect(0,0,c.width,c.height);delete c.dataset.s;c.dispatchEvent(new Event('input',{bubbles:true}))}
const sigBox=(id,lb)=>`<label>${lb} (พิมพ์ชื่อตัวบรรจง)<input id="n${id}"></label><canvas id="${id}" width="360" height="120"></canvas><button onclick="clr('${id}')">ล้างลายเซ็น</button>`;
const show=(h,vis,ex='')=>{$('#out').innerHTML=h+`<div style="margin:0 10px"><div id="st"></div><div id="ex" ${vis?'':'hidden'}><button class="p" onclick="shr()">แชร์</button><button onclick="png()">บันทึกรูป PNG</button><button onclick="print()">พิมพ์ / PDF</button></div>${ex}</div>`;$('#out').scrollIntoView()};
const cap=()=>html2canvas($('#dc'),{scale:2,backgroundColor:'#fff',windowWidth:1200,onclone:d=>{d.querySelectorAll('#dc').forEach(e=>e.style.zoom='1');d.querySelectorAll('.dw').forEach(e=>e.style.overflow='visible')}});
async function png(){const c=await cap(),a=document.createElement('a');a.download=$('#dc').dataset.id+'.png';a.href=c.toDataURL();a.click()}
async function shr(){const c=await cap();c.toBlob(async b=>{const f=new File([b],$('#dc').dataset.id+'.png',{type:'image/png'});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'รายการส่งผ้า'})}catch(e){}}else png()},'image/png')}
function commit(x,r){document.body.style.background='';last=x;const ts=new Date().toISOString();docs.push({id:x.id,type:x.type,d:x.d,sg:x.sg,ts});$('#v').innerHTML='';show(r(x,ts),0);send(x)}

 if(r.ok){b.textContent='บันทึกแล้ว';$('#ex').hidden=false;const t=$('#tsx');if(t)t.textContent=th(r.ts)}else b.innerHTML=`${esc(r.err)} <button onclick="send(last)">ลองอีกครั้ง</button>`}

function docT(x,ts){const d=x.d,s=x.sg||{},f=x.type=='floor',t=f?IT.map((_,i)=>[1,2,3,4,5].map(n=>n==d.fl?d.q[i]:0)):d.t,tot=t.map(sum),m=d.m||[];
 return`<div class="dw"><div class="doc" id="dc" data-id="${x.id}">${HD}<h3 class="c">รายการส่งผ้า${f?' (รับจากชั้น '+d.fl+')':''}</h3>${meta(f?[['ผู้จัดเตรียม',d.name],['วันที่',d.date],['เลขที่เอกสาร',x.id]]:[['ผู้จัดเตรียม',d.nameS],['วันที่',d.date],['บริษัทรับซัก',d.vendor],['เลขที่เอกสาร',x.id],['วันที่ส่งผ้า',d.date],['วันที่รับผ้า','']])}
<table class="ft">${FH}${IT.map((n,i)=>`<tr><td>${i+1}</td><td>${n}</td>${t[i].map(v=>`<td>${v||''}</td>`).join('')}<td>${tot[i]||''}</td><td>${esc(m[i])}</td></tr>`).join('')}<tr><th colspan="7">รวมจำนวนผ้าที่ส่ง</th><th>${sum(tot)}</th><th></th></tr></table>
${f?sgn([['หัวหน้าแม่บ้านรับทราบ',s.sig,d.name]]):sgn([['ผู้ส่ง',s.sigS,d.nameS],['ผู้รับ',s.sigR,d.nameR]])}${ts?`<small>บันทึกเมื่อ <span id="tsx">${th(ts)}</span></small>`:''}</div></div>`}
const RH='<tr><th>ลำดับ</th><th>รายการผ้า</th><th>ส่ง</th><th>รับคืน</th><th>ต่าง</th><th>หมายเหตุ</th></tr>';
function docR(x,ts){const d=x.d,n=docs.find(y=>y.id==d.nid),s=x.sg||{},m=d.m||[],T=n?n.d.tot:IT.map(()=>0);
 return`<div class="dw"><div class="doc" id="dc" data-id="${x.id}">${HD}<h3 class="c">รับผ้าคืนจากร้านซัก</h3>${meta([['ผู้ตรวจรับ',d.name],['วันที่รับผ้า',d.date],['อ้างอิงใบส่งผ้า',d.nid],['บริษัทรับซัก',n?n.d.vendor:'']])}
<table class="ft">${RH}${IT.map((nm,i)=>{const a=T[i],b=d.got[i],df=b-a;return a||b?`<tr><td>${i+1}</td><td>${nm}</td><td>${a}</td><td>${b}</td><td style="color:${df?'#b3261e':'#000'}">${df>0?'+':''}${df}</td><td>${esc(m[i])}</td></tr>`:''}).join('')}<tr><th colspan="2">รวม</th><th>${sum(T)}</th><th>${sum(d.got)}</th><th>${sum(d.got)-sum(T)}</th><th></th></tr></table>
${sgn([['ผู้ส่งคืน (ร้านซัก)',s.sigS,d.nameS],['ผู้ตรวจรับ (โรงแรม)',s.sigR,d.name]])}${ts?`<small>บันทึกเมื่อ <span id="tsx">${th(ts)}</span></small>`:''}</div></div>`}

/* ใบรับผ้าจากชั้น (ร่างเก็บอัตโนมัติแยกตามชั้น ใน localStorage) */
const tint=c=>document.body.style.background=`color-mix(in srgb,${c} 16%,var(--bg))`;
function keep(){if(!fl||!$('#c1')||!$('.q'))return;const g=dg(fl),c=$('#c1');
 g.q=[...document.querySelectorAll('.q')].map(e=>e.value);g.m=[...document.querySelectorAll('.m')].map(e=>e.value);g.name=$('#nc1').value;
 if(!c.dataset.ld)g.sig=c.dataset.s?c.toDataURL():'';FD=$('#fd').value;sv()}
$('#v').addEventListener('input',keep);addEventListener('pagehide',keep);document.addEventListener('visibilitychange',()=>{if(document.hidden)keep()});
const ftabs=()=>`<div class="tb">${FC.map((k,i)=>`<button style="${fl==i+1?`background:${k};color:#fff;border-color:${k}`:`color:${k};border-color:${k}`}" onclick="sw(${i+1})">ชั้น ${i+1}${hasD(i+1)?' ●':''}</button>`).join('')}<button style="${fl==0?'background:#1f5f4a;color:#fff;':'color:#1f5f4a;'}border-color:#1f5f4a" onclick="sw(0)">รวม</button></div>`;
function vf(){fv()}
function sw(n){keep();fl=n;sv();fv()}
function cl(){if(!confirm('ล้างข้อมูลที่กรอกไว้ของชั้น '+fl+' ?'))return;DR[fl]=E0();sv();fv()}
function fv(){if(!fl)return fa();const n=fl,c=FC[n-1],g=dg(n);tint(c);
$('#v').innerHTML=`<div class="card fl" style="border-top:6px solid ${c};background:color-mix(in srgb,${c} 14%,var(--c))">${HD}${ftabs()}
<label>วันที่<input type="date" id="fd" value="${FD||today()}"></label>
<div style="overflow-x:auto"><table><tr><th>#</th><th>รายการผ้า</th><th>จำนวน</th><th>หมายเหตุ</th></tr>${IT.map((nm,i)=>`<tr><td>${i+1}</td><td>${nm}</td><td><input type="number" min="0" inputmode="numeric" class="q" value="${g.q[i]||''}"></td><td><input class="m" value="${esc(g.m[i])}"></td></tr>`).join('')}</table></div>
${sigBox('c1','หัวหน้าแม่บ้านรับทราบ')}<button class="p" style="background:${c};border-color:${c}" onclick="sf()">บันทึกและเซ็น ชั้น ${n}</button><button onclick="cl()">ล้างข้อมูลชั้นนี้</button>
<div style="font-size:12px;color:var(--m);margin-top:6px">ข้อมูลที่กรอกถูกเก็บเป็นร่างอัตโนมัติในเครื่องนี้ แต่ยังไม่ส่งเข้าระบบจนกว่าจะกด "บันทึกและเซ็น"</div></div>`;
$('#nc1').value=g.name||'';const cv=$('#c1');pad(cv);
if(g.sig){cv.dataset.s=1;cv.dataset.ld=1;const im=new Image();im.onload=()=>{if(fl==n&&$('#c1')===cv){cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height)}delete cv.dataset.ld};im.onerror=()=>{delete cv.dataset.ld};im.src=g.sig}}
function sf(){const c=$('#c1'),nm=$('#nc1').value;if(!nm||!c.dataset.s)return alert('พิมพ์ชื่อและเซ็นก่อนบันทึก');if(c.dataset.ld)return;
 const n=fl,x={id:uid('F'),type:'floor',d:{date:$('#fd').value,fl:n,q:[...document.querySelectorAll('.q')].map(e=>+e.value||0),m:[...document.querySelectorAll('.m')].map(e=>e.value),name:nm},sg:{sig:c.toDataURL()}};
 FD=x.d.date;DR[n]=E0();sv();commit(x,docT)}

/* แท็บรวมทุกชั้น (ก่อนส่ง) */
function fa(){const d=FD||today(),used=new Set(docs.filter(x=>x.type=='note').flatMap(x=>x.d.fids)),F=[1,2,3,4,5],
 S=n=>docs.filter(x=>x.type=='floor'&&x.d.fl==n&&x.d.date==d&&!used.has(x.id)),
 sa=F.map(n=>IT.map((_,i)=>sum(S(n).map(x=>x.d.q[i])))),sb=F.map(n=>IT.map((_,i)=>+dg(n).q[i]||0)),
 v=(k,i)=>sa[k][i]+sb[k][i],tot=IT.map((_,i)=>sum(F.map((_,k)=>v(k,i)))),dn=F.filter(hasD);tint('#1f5f4a');
 $('#v').innerHTML=`<div class="card fl" style="border-top:6px solid #1f5f4a;background:color-mix(in srgb,#1f5f4a 14%,var(--c))">${HD}${ftabs()}<h3>รวมทุกชั้น</h3>
<label>วันที่<input type="date" id="fd" value="${d}" onchange="FD=this.value;sv();fa()"></label>
<div class="k">${F.map((n,k)=>{const p=[];if(S(n).length)p.push('✅ บันทึกแล้ว '+S(n).length+' ใบ');if(hasD(n))p.push('✏️ ร่าง ยังไม่บันทึก');return`<div style="border-left:4px solid ${FC[k]}">ชั้น ${n}<b>${sum(sa[k])+sum(sb[k])}</b>${p.join('<br>')||'ยังไม่มีข้อมูล'}</div>`}).join('')}<div style="border-left:4px solid #1f5f4a">รวมทั้งหมด<b>${sum(tot)}</b>ชิ้น</div></div>
${dn.length?`<p style="color:var(--r)">⚠ ชั้น ${dn.join(', ')} ยังไม่ได้กด "บันทึกและเซ็น" ใบส่งผ้าจะยังไม่รวมชั้นเหล่านี้ (ตัวเอียงสีส้ม = ร่าง)</p>`:''}
<div style="overflow-x:auto"><table class="ct"><tr><th>#</th><th>รายการผ้า</th>${F.map(n=>`<th>ชั้น ${n}</th>`).join('')}<th>รวม</th></tr>${IT.map((nm,i)=>`<tr><td>${i+1}</td><td>${nm}</td>${F.map((_,k)=>`<td class="${sb[k][i]?'dr':''}">${v(k,i)||''}</td>`).join('')}<td><b>${tot[i]||''}</b></td></tr>`).join('')}<tr><th colspan="7">รวมทั้งหมด</th><th>${sum(tot)}</th></tr></table></div>
<button class="p" onclick="gn()">ไปสร้างใบส่งผ้า</button></div>`}
function gn(){const d=FD||today();go('n');$('#na').value=$('#nb').value=d}

/* ใบส่งผ้า */
function vn(){$('#v').innerHTML=`<div class="card"><h2>ใบส่งผ้าซัก</h2><div class="g"><label>รวมผ้าจากวันที่<input type="date" id="na" value="${today()}"></label><label>ถึงวันที่<input type="date" id="nb" value="${today()}"></label></div>
<label>บริษัทรับซัก<input id="nv"></label><button class="p" onclick="pull()">สร้างใบส่งผ้า (แสดงตัวอย่าง)</button><div id="pv"></div></div>`}
const draft=()=>({date:today(),from:$('#na').value,to:$('#nb').value,vendor:$('#nv').value,fids:cur.fids,t:cur.t,tot:cur.tot,m:cur.m,nameS:'',nameR:''});
function pull(){const a=$('#na').value,b=$('#nb').value,used=new Set(docs.filter(x=>x.type=='note').flatMap(x=>x.d.fids)),
 f=docs.filter(x=>x.type=='floor'&&!used.has(x.id)&&x.d.date>=a&&x.d.date<=b);
 if(!f.length)return $('#pv').innerHTML='<p>ไม่พบใบรับผ้าที่ยังไม่ได้ส่งในช่วงนี้</p>';
 const t=IT.map((_,i)=>[1,2,3,4,5].map(n=>sum(f.filter(x=>x.d.fl==n).map(x=>x.d.q[i]))));
 cur={id:uid('LN'),fids:f.map(x=>x.id),t,tot:t.map(sum),m:IT.map((_,i)=>f.filter(x=>x.d.m&&x.d.m[i]).map(x=>`ชั้น ${x.d.fl}: ${x.d.m[i]}`).join(' ; '))};
 $('#pv').innerHTML=`<p>รวม ${f.length} ใบ ${sum(cur.tot)} ชิ้น ดูตัวอย่างด้านล่าง ให้คู่ค้าตรวจ แชร์หรือพิมพ์ก่อนเซ็นได้ หากถูกต้องให้เซ็นใต้ตัวอย่าง</p>`;
 show(docT({id:cur.id,type:'note',d:draft()},null),1,`<div class="card" style="margin:10px 0"><h3>เซ็นบนจอ</h3>${sigBox('c2','ผู้ส่ง (โรงแรม)')}${sigBox('c3','ผู้รับ (ร้านซัก)')}<button class="p" onclick="sn()">ยืนยันและบันทึก</button></div>`);pad($('#c2'));pad($('#c3'))}
function sn(){const c2=$('#c2'),c3=$('#c3'),ns=$('#nc2').value,nr=$('#nc3').value;if(!ns||!nr||!c2.dataset.s||!c3.dataset.s)return alert('ต้องพิมพ์ชื่อและเซ็นทั้งสองฝ่าย');
 const d=draft();d.nameS=ns;d.nameR=nr;commit({id:cur.id,type:'note',d,sg:{sigS:c2.toDataURL(),sigR:c3.toDataURL()}},docT)}

/* รับคืน */
function vr(){const done=new Set(docs.filter(x=>x.type=='ret').map(x=>x.d.nid)),ns=docs.filter(x=>x.type=='note'&&!done.has(x.id));
 $('#v').innerHTML=`<div class="card"><h2>รับผ้าคืน</h2><label>ใบส่งผ้าที่รอรับคืน<select id="rn" onchange="rr()">${ns.map(x=>`<option value="${x.id}">${x.id} (${esc(x.d.vendor)||'-'})</option>`).join('')||'<option value="">ไม่มีใบที่รอรับคืน</option>'}</select></label><div id="rb"></div></div>${ledger()}`;rr()}
function rr(){const x=docs.find(y=>y.id==$('#rn').value);if(!x)return $('#rb').innerHTML='';
 $('#rb').innerHTML=`<div class="doc" style="margin:0;max-width:none">${HD}<h3 class="c">รับผ้าคืนจากร้านซัก</h3>${meta([['วันที่รับผ้า',today()],['อ้างอิงใบส่งผ้า',x.id],['บริษัทรับซัก',x.d.vendor]])}<table class="ft">${RH}${IT.map((n,i)=>x.d.tot[i]?`<tr><td>${i+1}</td><td>${n}</td><td>${x.d.tot[i]}</td><td><input type="number" min="0" inputmode="numeric" class="g2" data-i="${i}" value="${x.d.tot[i]}" oninput="df()"></td><td id="df${i}">0</td><td><input class="m2" data-i="${i}"></td></tr>`:'').join('')}</table></div>${sigBox('c4','ผู้ส่งคืน (ร้านซัก)')}${sigBox('c5','ผู้ตรวจรับ (โรงแรม)')}<button class="p" onclick="sr()">ยืนยันและบันทึก</button>`;pad($('#c4'));pad($('#c5'))}
function df(){const x=docs.find(y=>y.id==$('#rn').value);document.querySelectorAll('.g2').forEach(e=>{const i=e.dataset.i,d=(+e.value||0)-x.d.tot[i],c=$('#df'+i);c.textContent=d>0?'+'+d:d;c.style.color=d?'#b3261e':''})}
function sr(){const x=docs.find(y=>y.id==$('#rn').value),c4=$('#c4'),c5=$('#c5'),a=$('#nc4').value,b=$('#nc5').value;
 if(!x||!a||!b||!c4.dataset.s||!c5.dataset.s)return alert('ต้องพิมพ์ชื่อและเซ็นทั้งสองฝ่าย');
 const got=IT.map(()=>0),m=IT.map(()=>'');document.querySelectorAll('.g2').forEach(e=>got[e.dataset.i]=+e.value||0);document.querySelectorAll('.m2').forEach(e=>m[e.dataset.i]=e.value);
 commit({id:uid('R'),type:'ret',d:{date:today(),nid:x.id,got,m,nameS:a,name:b},sg:{sigS:c4.toDataURL(),sigR:c5.toDataURL()}},docR)}
function ledger(){const sh=IT.map(()=>0),ov=IT.map(()=>0);
 docs.filter(x=>x.type=='ret').forEach(r=>{const n=docs.find(y=>y.id==r.d.nid);if(n)IT.forEach((_,i)=>{const d=n.d.tot[i]-r.d.got[i];d>0?sh[i]+=d:ov[i]-=d})});
 const rows=IT.map((n,i)=>sh[i]||ov[i]?`<tr><td>${n}</td><td>${sh[i]||''}</td><td>${ov[i]||''}</td></tr>`:'').join('');
 return`<div class="card"><h2>ทะเบียนผ้าค้างส่ง (สะสม)</h2>${rows?`<table><tr><th>รายการ</th><th>ค้าง</th><th>เกิน</th></tr>${rows}</table>`:'<p>ไม่มียอดค้าง</p>'}</div>`}

/* สรุป */
function vs(){$('#v').innerHTML=`<div class="card"><h2>สรุปรายเดือน</h2><label>เดือน<input type="month" id="sm" value="${today().slice(0,7)}" onchange="ds()"></label><div id="sd"></div></div>`;ds()}
function ds(){const m=$('#sm').value,f=x=>(x.d.date||'').startsWith(m),N=docs.filter(x=>x.type=='note'&&f(x)),R=docs.filter(x=>x.type=='ret'&&f(x)),F=docs.filter(x=>x.type=='floor'&&f(x));
 let got=0,lost=0,ev=0;R.forEach(r=>{got+=sum(r.d.got);const n=docs.find(y=>y.id==r.d.nid);if(!n)return;const l=sum(IT.map((_,i)=>Math.max(0,n.d.tot[i]-r.d.got[i])));lost+=l;if(l)ev++});
 const day={};F.forEach(x=>day[x.d.date]=(day[x.d.date]||0)+sum(x.d.q));
 const K=[['ส่งซัก (ครั้ง)',N.length],['ชิ้นที่ส่งซัก',sum(N.map(x=>sum(x.d.tot)))],['ชิ้นที่รับคืน',got],['ชิ้นขาด/ค้าง',lost],['ครั้งที่รับไม่ครบ',ev],['ใบชั้นที่มีหมายเหตุ',F.filter(x=>(x.d.m||[]).some(Boolean)).length]];
 $('#sd').innerHTML=`<div class="k">${K.map(k=>`<div>${k[0]}<b>${k[1]}</b></div>`).join('')}</div><h3 style="margin-top:14px">ผ้าที่รับจากชั้นรายวัน (ชิ้น)</h3><table>${Object.keys(day).sort().map(d=>`<tr><td>${d}</td><td>${day[d]}</td></tr>`).join('')||'<tr><td>ไม่มีข้อมูล</td></tr>'}</table>`}
</script></body></html>
