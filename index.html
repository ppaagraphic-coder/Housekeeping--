<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ผ้าซักโรงแรม</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 "Sarabun","Noto Sans Thai",system-ui,sans-serif;background:#f1f3f5;color:#1a1d21}
header{background:#14323f;color:#fff;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
nav{display:flex;gap:4px;overflow-x:auto;background:#fff;padding:6px;position:sticky;top:46px;z-index:4;border-bottom:1px solid #dde1e5}
nav button{padding:8px 14px;border:0;border-radius:8px;background:#eef1f3;font:inherit;white-space:nowrap}
nav button.on{background:#14323f;color:#fff}
.card{background:#fff;margin:10px;padding:12px;border-radius:10px}
h3{margin:0 0 8px}
button{font:inherit;cursor:pointer}
.p{background:#0e7c66;color:#fff;border:0;border-radius:8px;padding:11px 16px;width:100%;margin-top:10px;font-weight:600}
.s{background:#fff;color:inherit;border:1px solid #cfd5da;border-radius:6px;padding:3px 9px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:0;border-radius:18px;padding:7px 14px;font-weight:600}
input,select{font:inherit;padding:6px;border:1px solid #cfd5da;border-radius:6px;max-width:100%}
.row{display:grid;grid-template-columns:1fr 64px 1fr;gap:6px;align-items:center;padding:3px 0;border-bottom:1px solid #f0f2f4}
.row input{width:100%}
.ov{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
td,th{border:1px solid #dde1e5;padding:4px 5px;text-align:center}
td.l{text-align:left}
th{background:#f1f3f5}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.sig{border:1px dashed #8a949c;background:#fff;touch-action:none;width:100%;height:90px;display:block}
.k{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k div{background:#f1f3f5;border-radius:8px;padding:8px}
.k b{display:block;font-size:20px}
.tag{padding:1px 8px;border-radius:10px;background:#fde8e8;color:#b42318;font-size:12px}
.ok{background:#dcf5e8;color:#0e7c66}
</style></head><body>
<div id="app"></div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbwHYtCcxyp_3m25imNwjPe6omrWzdGVljrUJFKcBHCNWZflMXiUrDqeXVd1MVvB5n4-/exec'; // ← วาง URL Web App จาก Apps Script (ว่าง = โหมดทดลอง เก็บในเครื่อง PIN: 1111 แม่บ้าน / 2222 สโตร์ / 9999 แอดมิน)
const Z = ['ชั้น 1','ชั้น 2','ชั้น 3','ชั้น 4','ชั้น 5','วิลล่า']; // 8+8+8+8+8 ห้อง + วิลล่า 1 ห้อง = 41 ห้อง
const COL = ['#c2410c','#a16207','#15803d','#0e7490','#1d4ed8','#7e22ce'];
const DEF = ["ผ้าปูที่นอนแบบติดซิป (ด้าน A) ขนาด 183 ซม.", "ผ้าปูที่นอนแบบติดซิป (ด้าน B) ขนาด 107 ซม.", "ผ้ารองกันเปื้อนกันน้ำ ขนาด 183 ซม", "ผ้ารองกันเปื้อนกันน้ำ ขนาด 107 ซม.", "ผ้าปูที่นอนแบบรัดมุม ขนาด 183 ซม.", "ผ้าปูที่นอนแบบรัดมุม ขนาด 107 ซม.", "ปลอกผ้านวม ขนาด 80 นิ้ว", "ปลอกผ้านวม ขนาด 105 นิ้ว", "ไส้ผ้านวมไมโครไฟเบอร์ 3D ขนาด 80 นิ้ว", "ไส้ผ้านวมไมโครไฟเบอร์ 3D ขนาด 105 นิ้ว", "หมอนไมโครไฟเบอร์ ขนาด 19", "หมอนไมโครไฟเบอร์ ขนาด 19 แบบแข็ง", "ปลอกหมอนกันเปื้อนติดซิป ขนาด 19 นิ้ว", "ปลอกหมอน ขนาด 20 นิ้ว", "ผ้าขนหนูเช็ดตัว ขนาด 30", "ผ้าขนหนูเช็ดมือ ขนาด 15", "ผ้าขนหนูเช็ดหน้า ขนาด 12", "ผ้าขนหนูเช็ดเท้า ขนาด 18", "เสื้อคลุมอาบน้ำผ้าฝ้าย ขนาด 56"]
  .map((n,i)=>({id:'i'+i,n,p:0,stock:0,par:[0,0,0,0,0,0]})); // รายการตามแบบฟอร์มเดิม แก้ราคา/par ได้ในหน้า "สต็อก"

const $=id=>document.getElementById(id), today=()=>new Date().toISOString().slice(0,10),
  uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5), sum=a=>a.reduce((x,y)=>x+y,0);
let S=JSON.parse(localStorage.S||'null')||{cfg:[],logs:[],sends:[],rets:[],cases:[],manual:[],closes:[]},
  Q=JSON.parse(localStorage.Q||'[]'), role=localStorage.role||'', pin=localStorage.pin||'', tab='',
  D={z:0,...JSON.parse(localStorage.DQ||'{"q":{},"n":{}}'),m:today().slice(0,7)}, busy=0;
const items=()=>(S.cfg[0]&&S.cfg[0].items)||DEF;
const save=()=>{localStorage.S=JSON.stringify(S);localStorage.Q=JSON.stringify(Q)};
const dq=()=>{localStorage.DQ=JSON.stringify({q:D.q,n:D.n})};
const badge=()=>{const b=$('bd');if(b)b.textContent=Q.length?'⏳'+Q.length:'✓'};

// บันทึกลงเครื่องทันที แล้วส่งขึ้น Sheet เบื้องหลัง (คิวส่งซ้ำเมื่อเน็ตหลุด)
function up(c,r){const a=S[c],i=a.findIndex(x=>x.id==r.id);i<0?a.push(r):a[i]=r;Q.push({c,r});save();flush()}
async function flush(){
  if(busy||!Q.length){badge();return}
  if(!API){Q=[];save();badge();return}
  busy=1;const m=new Map();Q.forEach(o=>m.set(o.c+o.r.id,o));const n=Q.length;
  try{const r=await(await fetch(API,{method:'POST',body:JSON.stringify({pin,ops:[...m.values()]})})).json();
    if(r.ok){Q=Q.slice(n);save()}}catch(e){}
  busy=0;badge();if(Q.length)setTimeout(flush,5000)}
const pins=()=>{try{return JSON.parse(localStorage.pins||'{}')}catch(e){return{}}};
async function sync(){
  if(!API)return;const bd=$('bd');if(bd)bd.textContent='⟳ โหลด…';
  try{const r=await(await fetch(API+'?pin='+pin)).json();
    if(r.err){const k=pins();delete k[pin];localStorage.pins=JSON.stringify(k);return logout()}
    S=r.data;Q.forEach(o=>{const a=S[o.c],i=a.findIndex(x=>x.id==o.r.id);i<0?a.push(o.r):a[i]=o.r});save();render()}catch(e){badge()}}
// เข้าระบบเร็ว: PIN ที่เคยเข้าสำเร็จในเครื่องนี้ → เข้าทันทีด้วยข้อมูลที่แคชไว้ แล้วโหลดข้อมูลล่าสุดเบื้องหลัง
// PIN ใหม่ → ตรวจ PIN อย่างเดียว (check=1 ไม่ต้องโหลดข้อมูลทั้งหมด) แล้วค่อยโหลดข้อมูลเบื้องหลัง
async function login(){
  const p=$('pin').value,btn=document.querySelector('#app button.p'),k=pins(),
    reset=()=>{if(btn){btn.disabled=false;btn.textContent='เข้าสู่ระบบ'}},
    done=(r,bg)=>{role=r;pin=p;k[p]=r;localStorage.pins=JSON.stringify(k);localStorage.role=role;localStorage.pin=pin;save();render();if(bg)sync()};
  if(!API){const R={1111:'hk',2222:'store',9999:'admin'};if(!R[p])return alert('PIN ไม่ถูกต้อง');return done(R[p])}
  if(k[p])return done(k[p],1);
  if(btn){btn.disabled=true;btn.textContent='กำลังตรวจสอบ…'}
  try{const r=await(await fetch(API+'?pin='+encodeURIComponent(p)+'&check=1')).json();
    if(r.err){reset();return alert('PIN ไม่ถูกต้อง')}
    if(r.data){S=r.data;done(r.role)}else done(r.role,1)}
  catch(e){reset();alert('เชื่อมต่อไม่ได้')}}
function logout(){role=pin='';localStorage.role=localStorage.pin='';render()}

// ---- ลายเซ็น + แชร์ไฟล์หลักฐาน A4 (LINE) ----
const pad=id=>`<canvas id="${id}" class="sig" width="300" height="90"></canvas><button class="s" onclick="clr('${id}')">ล้าง</button>`;
function initPads(){document.querySelectorAll('canvas.sig').forEach(c=>{const x=c.getContext('2d');x.lineWidth=2;x.lineCap='round';let d=0;
  const p=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*300/r.width,(e.clientY-r.top)*90/r.height]};
  c.onpointerdown=e=>{d=1;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...p(e));c.dirty=1};
  c.onpointermove=e=>{if(d){x.lineTo(...p(e));x.stroke()}};c.onpointerup=()=>d=0})}
const clr=id=>{const c=$(id);c.getContext('2d').clearRect(0,0,300,90);c.dirty=0};
const sg=id=>{const c=$(id);return c&&c.dirty?c.toDataURL('image/png'):''};
// ---- คำนวณ ----
const tot=L=>{const T={};L.forEach(l=>Object.keys(l.q).forEach(i=>{(T[i]=T[i]||[0,0,0,0,0,0])[l.z]+=l.q[i]}));return T};
const outst=(s,i)=>(s.lines[i]||0)-sum(S.rets.filter(r=>r.sendId==s.id).map(r=>r.g[i]||0))
  -sum(S.cases.filter(c=>c.sendId==s.id&&c.item==i&&c.st=='closed').map(c=>c.q));
const nm=i=>(items().find(x=>x.id==i)||{n:i}).n;
const grid=(I,T)=>`<div class="ov"><table><tr><th>รายการ</th>${Z.map(z=>`<th>${z.replace('ชั้น ','')}</th>`).join('')}<th>รวม</th></tr>${
  I.map(it=>`<tr><td class="l">${it.n}</td>${T[it.id].map(v=>`<td>${v||''}</td>`).join('')}<td><b>${sum(T[it.id])}</b></td></tr>`).join('')}</table></div>`;
const gridT=(I,T)=>grid(I,T).replace('</table>',`<tr><td class="l"><b>รวมทั้งหมด</b></td>${Z.map((_,z)=>`<td><b>${sum(I.map(it=>T[it.id][z]))||''}</b></td>`).join('')}<td><b>${sum(I.map(it=>sum(T[it.id])))}</b></td></tr></table>`);
const totT=(I,T)=>`<div class="ov"><table><tr><th>รายการ</th><th style="width:90px">รวม (ชิ้น)</th></tr>${I.map(it=>`<tr><td class="l">${it.n}</td><td><b>${sum(T[it.id])}</b></td></tr>`).join('')}<tr><td class="l"><b>รวมทั้งหมด</b></td><td><b>${sum(I.map(it=>sum(T[it.id])))}</b></td></tr></table></div>`;
const lineTxt=(it,a)=>`${it.n}: ${a.map((v,z)=>v?Z[z]+'='+v:'').filter(Boolean).join(' ')} รวม ${sum(a)}`;

function docModel(kind,s,r){

// ปุ่มพิมพ์ทั้งหมด → เปิดเอกสารเป็น PDF A4 ในแท็บใหม่ (กดพิมพ์/บันทึกจากตัวดู PDF ได้)

// ---- สร้างไฟล์ PDF A4 แนวนอน (วาดฟอร์มเดียวกับปุ่มพิมพ์) แล้วแชร์ / ดาวน์โหลด ----
async function docCanvas(M){

  const wrap=(t,w)=>{t=String(t==null?'':t);if(!t)return[''];
    const ps=(seg?[...seg.segment(t)].map(s=>s.segment):[...t]).flatMap(p=>x.measureText(p).width>w?[...p]:[p]);
    const o=[];let cur='';for(const p of ps){if(cur&&x.measureText(cur+p).width>w){o.push(cur);cur=p.replace(/^\s+/,'')}else cur+=p}o.push(cur);return o};

    const mm=[11,0,...(nz?[...Array(nz).fill(12),14,CWM*.28]:[22,CWM*.4])],
      used=mm.reduce((a,b)=>a+b,0);mm[1]=CWM-used;

    const hOf=(t,w)=>{font(0);return wrap(t,w-2.4*K).length*lh+2.2*K};
    const box=(cx,cy,w,h,t,al,b)=>{if(!draw)return;x.lineWidth=.26*K;x.strokeStyle='#000';x.strokeRect(cx,cy,w,h);
      if(t===''||t==null)return;font(b);const ls=wrap(t,w-2.4*K);x.fillStyle='#000';x.textAlign=al;x.textBaseline='middle';
      const tx=al=='left'?cx+1.2*K:cx+w/2;ls.forEach((l,i)=>x.fillText(l,tx,cy+(h-ls.length*lh)/2+(i+.5)*lh))};
    let y=MY*K;
    const hh=CW*92/1400;if(draw&&hdr)x.drawImage(hdr,X0,y,CW,hh);y+=hh+1.5*K;
    if(draw){x.font=`bold ${4.8*f*K}px ${FF}`;x.fillStyle='#000';x.textAlign='center';x.textBaseline='middle';x.fillText(title,X0+CW/2,y+3.2*f*K)}y+=7.4*f*K;
    const fr=lh+1.2*K,cwid=CWM*.48*K,lab=22*K,xr=X0+CW-cwid,
      F=[[['ผู้จัดเตรียม',by],['วันที่',dt],['บริษัทรับซัก',day?'':(d&&d.co)||'']],
         [['เลขที่เอกสาร',no],['วันที่ส่งผ้า',day?'':(d&&d.date)||''],['วันที่รับผ้า',kind=='ret'?r.date:'']]];
    F.forEach((col,ci)=>col.forEach((p,i)=>{if(!draw)return;const fx=ci?xr:X0,fy=y+i*fr;font(0);x.fillStyle='#000';x.textAlign='left';x.textBaseline='middle';
      x.fillText(p[0],fx,fy+fr/2);x.fillText(String(p[1]||''),fx+lab+1*K,fy+fr/2);x.lineWidth=.26*K;x.beginPath();x.moveTo(fx+lab,fy+fr-.5*K);x.lineTo(fx+cwid,fy+fr-.5*K);x.stroke()}));
    y+=3*fr+2*K;const ty=y;

      box(xs[2],y,xs[nz+3]-xs[2],base,'จำนวนผ้า / ชั้น','center',1);box(xs[nz+3],y,xs[nz+4]-xs[nz+3],2*base,'หมายเหตุ','center',1);y+=base;
      for(let z=0;z<nz;z++)box(xs[2+z],y,mm[2+z]*K,base,Z[z],'center',1);box(xs[2+nz],y,mm[2+nz]*K,base,'รวม','center',1);y+=base}
    else{['ลำดับ','รายการผ้า','รวม','หมายเหตุ'].forEach((t,i)=>box(xs[i],y,mm[i]*K,base,t,'center',1));y+=base}
    const nc=mm.length;
    I.forEach((it,k)=>{const rmk=rm(it),h=Math.max(base,hOf(it.n,mm[1]*K),hOf(rmk,mm[nc-1]*K)),
      cells=[k+1,it.n,...Array.from({length:nz},(_,z)=>((zq[it.id]||[])[z])||''),tv(it)||'',rmk];
      cells.forEach((t,i)=>box(xs[i],y,mm[i]*K,h,t,(i==1||i==nc-1)?'left':'center',0));y+=h});
    box(xs[0],y,xs[2]-xs[0],base,day?'รวมจำนวนผ้าที่เก็บ':send?'รวมจำนวนผ้าที่ส่ง':'รวมจำนวนผ้าที่รับ','center',1);
    for(let z=0;z<nz;z++)box(xs[2+z],y,mm[2+z]*K,base,sum(I.map(it=>(zq[it.id]||[])[z]||0))||'','center',1);
    box(xs[nc-2],y,mm[nc-2]*K,base,T||'','center',1);box(xs[nc-1],y,mm[nc-1]*K,base,'','center',0);y+=base;
    if(draw){x.lineWidth=.5*K;x.strokeStyle='#000';x.strokeRect(X0,ty,CW,y-ty)}

      if(im){const sc=Math.min(bw/im.width,sh/im.height),w=im.width*sc,h=im.height*sc;x.drawImage(im,bx+(bw-w)/2,y+(sh-h)/2,w,h)}

async function makePdf(M){
  const c=await docCanvas(M),jpg=new Uint8Array(await(await new Promise(r=>c.toBlob(r,'image/jpeg',.92))).arrayBuffer()),
    pw=841.89,ph=595.28,enc=new TextEncoder(),parts=[],off=[];let len=0;
  const add=v=>{const u=typeof v=='string'?enc.encode(v):v;parts.push(u);len+=u.length},
    obj=(n,b)=>{off[n]=len;add(`${n} 0 obj\n${b}\nendobj\n`)};
  add('%PDF-1.4\n');obj(1,'<</Type/Catalog/Pages 2 0 R>>');obj(2,'<</Type/Pages/Kids[3 0 R]/Count 1>>');
  obj(3,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${pw} ${ph}]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>`);
  off[4]=len;add(`4 0 obj\n<</Type/XObject/Subtype/Image/Width ${c.width}/Height ${c.height}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jpg.length}>>\nstream\n`);add(jpg);add('\nendstream\nendobj\n');
  const cs=`q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;obj(5,`<</Length ${cs.length}>>\nstream\n${cs}\nendstream`);
  const xr=len;add('xref\n0 6\n0000000000 65535 f \n'+[1,2,3,4,5].map(n=>String(off[n]).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'})}
// สร้าง PDF A4 ของเอกสารนั้น แล้วเปิดหน้าแชร์ (LINE ฯลฯ) — ถ้าเครื่องไม่รองรับจะดาวน์โหลดไฟล์แทน

  const r={id:uid(),sendId:sid,date:today(),g,d,rn,ra,rb};up('rets',r);
  r.m={};Object.keys(g).forEach(i=>{const out=outst(s,i),dd=Math.min(d[i]||0,out),m=out-dd;r.m[i]=m;
    [['ตำหนิ',dd],['ไม่ได้รับ',m]].forEach(([t,q])=>{const c=S.cases.find(c=>c.sendId==sid&&c.item==i&&(c.t==t||(t=='ไม่ได้รับ'&&c.t=='ขาด'))&&c.st=='open');
      if(c){c.q=q;if(!q){c.st='closed';c.kind='auto'}up('cases',c)}else if(q)up('cases',{id:uid(),sendId:sid,item:i,t,q,st:'open',date:today()})})});
  up('rets',r);chk(s);const rows=Object.keys(g).filter(i=>g[i]||d[i]).map(i=>`${nm(i)}: รับ ${g[i]} ตำหนิ ${d[i]}${rn[i]?' ('+rn[i]+')':''}`);render();
  shareDoc('ret',null,r)}
function chk(s){s.st=Object.keys(s.lines).some(i=>outst(s,i)>0)?'open':'closed';up('sends',s)}
function closeCase(id,kind){const c=S.cases.find(x=>x.id==id);c.st='closed';c.kind=kind;c.cdate=today();
  c.amt=kind=='ชดใช้'?(+prompt('จำนวนเงินชดใช้ (บาท)','0')||0):0;up('cases',c);chk(S.sends.find(x=>x.id==c.sendId));render()}

// ---- 2. แอดมิน ----
V.admin=()=>{const m=D.m,P=Object.fromEntries(items().map(i=>[i.id,i.p||0])),inM=d=>(d||'').slice(0,7)==m,
  Lm=S.logs.filter(l=>inM(l.date)),Sm=S.sends.filter(s=>inM(s.date)),col=sum(Lm.map(l=>sum(Object.values(l.q)))),
  snt=sum(Sm.map(s=>sum(Object.values(s.lines)))),cost=sum(Sm.map(s=>sum(Object.keys(s.lines).map(i=>s.lines[i]*(P[i]||0))))),
  man=S.manual.filter(x=>inM(x.date)&&!x.del),mans=sum(man.map(x=>+x.amt||0)),comp=sum(S.cases.filter(c=>c.kind=='ชดใช้'&&inM(c.cdate)).map(c=>c.amt)),
  days=[...new Set(Lm.map(l=>l.date).concat(Sm.map(s=>s.date)))].sort(),O=S.cases.filter(c=>c.st=='open'&&c.q>0),cl=S.closes.find(x=>x.id=='m'+m),
  unsent=sum(S.logs.filter(l=>!l.sendId).map(l=>sum(Object.values(l.q))));
  return `<div class="card"><h3>สรุปเดือน <input type="month" value="${m}" onchange="D.m=this.value;render()"> ${cl?'<span class="tag ok">ปิดยอดแล้ว</span>':''}</h3>
  <div class="k"><div>ยอดสะสมยังไม่ส่ง<b>${unsent}</b></div><div>เก็บผ้าเดือนนี้<b>${col}</b></div><div>ส่งซัก (${Sm.length} ครั้ง)<b>${snt}</b></div>
  <div>ค่าซัก (บาท)<b>${cost.toLocaleString()}</b></div><div>ค่าใช้จ่ายอื่นกรอกเอง<b>${mans.toLocaleString()}</b></div><div>ชดใช้ (บาท)<b>${comp.toLocaleString()}</b></div>
  <div style="grid-column:span 2">รวมรายจ่าย (ค่าซัก+อื่นๆ) <b>${(cost+mans).toLocaleString()} บาท</b></div></div>
  <p><small>เก็บผ้า = ยอดที่แม่บ้านบันทึกในแท็บ "เก็บผ้า" · ส่งซัก = ยอดในใบส่งซักของเดือนที่เลือก · ค่าซัก = จำนวนส่งซัก × ราคา (ตั้งราคาในแท็บ "สต็อก")</small></p>
  <button class="p" onclick="closeM(${col},${snt},${cost},${mans},${comp})">ปิดยอดเดือน ${m}</button></div>
  <div class="card"><h3>ค่าใช้จ่ายอื่น (กรอกเอง) — ${m}</h3><div class="ov"><table><tr><th>วันที่</th><th>รายการ</th><th style="width:110px">จำนวนเงิน (บาท)</th><th style="width:50px"></th></tr>
  ${man.map(x=>`<tr><td><input type="date" value="${x.date}" onchange="editMan('${x.id}','date',this.value)"></td><td><input value="${esc(x.label)}" style="width:100%" onchange="editMan('${x.id}','label',this.value)"></td><td><input type="number" inputmode="decimal" value="${+x.amt||0}" style="width:100px;text-align:right" onchange="editMan('${x.id}','amt',this.value)"></td><td><button class="s" onclick="delMan('${x.id}')">ลบ</button></td></tr>`).join('')}
  <tr style="background:#f6f8f9"><td><input id="mn_d" type="date" value="${inM(today())?today():m+'-01'}"></td><td><input id="mn_l" placeholder="รายการใหม่" style="width:100%"></td><td><input id="mn_a" type="number" inputmode="decimal" placeholder="0" style="width:100px;text-align:right"></td><td><button class="s" onclick="addMan()">+ เพิ่ม</button></td></tr>
  <tr><td colspan="2" class="l"><b>รวม</b></td><td><b>${mans.toLocaleString()}</b></td><td></td></tr></table></div></div>
  <div class="card"><h3>เคสตำหนิ/ไม่ได้รับที่ยังไม่ปิด (${O.length})</h3>${O.map(c=>{const s=S.sends.find(x=>x.id==c.sendId)||{};return `<div style="padding:6px 0;border-bottom:1px solid #eee">${s.no||''} · ${nm(c.item)} · <span class="tag">${c.t=='ขาด'?'ไม่ได้รับ':c.t} ${c.q}</span><br>
   <button class="s" onclick="closeCase('${c.id}','ได้คืนแล้ว')">ปิด: ได้คืน</button> <button class="s" onclick="closeCase('${c.id}','ชดใช้')">ปิด: ชดใช้</button></div>`}).join('')||'ไม่มี'}</div>
  <div class="card"><h3>รายวัน</h3><div class="ov"><table><tr><th>วันที่</th><th>เก็บ</th><th>ส่งซัก</th></tr>${days.map(d=>`<tr><td>${d}</td><td>${sum(Lm.filter(l=>l.date==d).map(l=>sum(Object.values(l.q))))}</td><td>${sum(Sm.filter(s=>s.date==d).map(s=>sum(Object.values(s.lines))))}</td></tr>`).join('')}</table></div></div>`};
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function addMan(){const label=$('mn_l').value.trim(),amt=+$('mn_a').value||0,date=$('mn_d').value||today();
  if(!label&&!amt)return alert('กรอกรายการหรือจำนวนเงิน');up('manual',{id:uid(),date,label,amt});render()}
function editMan(id,f,v){const x=S.manual.find(y=>y.id==id);if(!x)return;x[f]=f=='amt'?(+v||0):v;up('manual',x);render()}
function delMan(id){const x=S.manual.find(y=>y.id==id);if(!x||!confirm('ลบรายการ '+(x.label||'')+' ?'))return;x.del=1;up('manual',x);render()}
function closeM(col,snt,cost,man,comp){const m=D.m;if(!confirm('ปิดยอดเดือน '+m+'?'))return;up('closes',{id:'m'+m,month:m,collected:col,sent:snt,cost,manual:man,comp,ts:Date.now()});render()}

// ---- 3. สโตร์ ----
V.store=()=>{const I=D.cfg||items();
  return `<div class="card"><h3>ผ้าทั้งหมด: สต็อก / par ตามชั้น / ที่ร้านซัก</h3><p>ที่ชั้นพร้อมใช้ = par − ค้างที่ร้านซัก · ทั้งหมด = สต็อก + par</p>
  <div class="ov"><table><tr><th>รายการ</th><th>ราคา</th><th>สต็อก</th>${Z.map((z,i)=>`<th style="color:${COL[i]}">par ${z.replace('ชั้น ','')}</th>`).join('')}<th>par รวม</th><th>ที่ร้านซัก</th><th>พร้อมใช้</th><th>ทั้งหมด</th></tr>
  ${I.map((it,k)=>{const L=sum(S.sends.filter(s=>s.st!='closed').map(s=>Math.max(0,outst(s,it.id)))),ps=sum(it.par);
   return `<tr><td><input value="${it.n}" size="14" oninput="ed(${k},'n',this.value)"></td><td><input type="number" value="${it.p||0}" style="width:54px" oninput="ed(${k},'p',+this.value)"></td>
   <td><input type="number" value="${it.stock||0}" style="width:54px" oninput="ed(${k},'stock',+this.value)"></td>
   ${it.par.map((v,z)=>`<td><input type="number" value="${v||0}" style="width:46px" oninput="ed(${k},'par',+this.value,${z})"></td>`).join('')}
   <td>${ps}</td><td>${L}</td><td>${ps-L}</td><td><b>${(it.stock||0)+ps}</b></td></tr>`}).join('')}</table></div>
  <button class="p" onclick="saveCfg()">บันทึกสต็อก/par/ราคา</button>
  <button class="p" style="background:#334155" onclick="resetNames()">ใช้ชื่อรายการตามฟอร์ม PDF (คงราคา/สต็อก/par เดิม)</button></div>`};
function ed(k,f,v,z){D.cfg=D.cfg||JSON.parse(JSON.stringify(items()));if(z==null)D.cfg[k][f]=v;else D.cfg[k].par[z]=v}
function resetNames(){const I=JSON.parse(JSON.stringify(items()));DEF.forEach((d,i)=>{if(I[i])I[i].n=d.n;else I.push(d)});D.cfg=null;up('cfg',{id:'cfg',items:I});render()}
function saveCfg(){up('cfg',{id:'cfg',items:D.cfg||items()});D.cfg=null;render()}

// ---- โครงหน้า ----
const TABS={hk:['collect','acc','send','ret','pend'],store:['store'],admin:['collect','acc','send','ret','pend','admin','store']},
  TN={collect:'เก็บผ้า',acc:'สะสมยอดผ้า',pend:'ค้างรับสะสม',send:'ส่งซัก',ret:'รับคืน',admin:'แอดมิน',store:'สต็อก'};
function render(){
  if(!role){$('app').innerHTML=`<div class="card" style="max-width:320px;margin:60px auto"><h3>🧺 ผ้าซักโรงแรม</h3>
    <input id="pin" type="password" inputmode="numeric" placeholder="PIN" style="width:100%"><button class="p" onclick="login()">เข้าสู่ระบบ</button>
    ${API?'':'<p><small>โหมดทดลอง (ยังไม่ตั้ง API): 1111 แม่บ้าน · 2222 สโตร์ · 9999 แอดมิน</small></p>'}</div>`;return}
  const t=TABS[role];if(!t.includes(tab))tab=t[0];
  $('app').innerHTML=`<header><b>🧺 ผ้าซักโรงแรม</b><span><span id="bd"></span> <button class="s" onclick="sync()">⟳</button> <button class="s" onclick="logout()">ออก</button></span></header>
  <nav>${t.map(k=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';render()">${TN[k]}</button>`).join('')}</nav>`+V[tab]();
  initPads();badge()}
render();if(role)sync();addEventListener('online',flush);
</script></body></html>
